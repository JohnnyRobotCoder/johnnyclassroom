<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>Johnny Classroom</title>
<link rel="icon" href="https://github.com/johnny0robot/johnnyclassroom/blob/main/Untitled%20design%20(2).png?raw=true">
<link rel="preconnect" href="https://googleapis.com">
<link rel="preconnect" href="https://gstatic.com" crossorigin>
<link href="https://googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light dark;
  --bg-color: #ffffff;
  --text-color: #202124;
  --header-bg: #f1f3f4;
  --elements-bg: #ffffff;
  --card-bg: #ffffff;
  --border-color: #e0e0e0;
  --list-bg: #f8f9fa;
  --accent: #1a73e8;
  --shadow: rgba(0, 0, 0, 0.1);
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg-color: #202124;
    --text-color: #e8eaed;
    --header-bg: #2d2d30; /* Light black for the top bar */
    --elements-bg: #292a2d;
    --card-bg: #292a2d;
    --border-color: #3c4043;
    --list-bg: #35363a;
    --accent: #8ab4f8;
  }
}

body {
  font-family: Roboto, "Google Sans Flex", sans-serif;
  background-color: var(--bg-color);
  color: var(--text-color);
  margin: 0;
  padding: 0;
  transition: background-color 0.2s ease, color 0.2s ease;
}

header {
  background-color: var(--header-bg);
  border-bottom: 1px solid var(--border-color);
  padding: 15px 30px;
  display: flex;
  align-items: center;
  box-shadow: 0 2px 4px var(--shadow);
  transition: background-color 0.2s ease;
}

header img {
  height: 40px;
  margin-right: 15px;
}

header h1 {
  margin: 0;
  font-size: 28px;
  color: #e54c30;
}

header button {
  margin-left: auto;
}

ul {
  list-style-type: none;
  padding: 0;
}

li {
  background: var(--list-bg);
  border: 1px solid var(--border-color);
  margin: 6px 0;
  padding: 8px;
  border-radius: 6px;
  font-family: monospace;
}

.card {
  background-color: var(--card-bg);
  border: 1px solid var(--border-color);
  border-radius: 12px;
  padding: 20px;
  max-width: 350px;
  margin: 40px auto;
  text-align: center;
  box-shadow: 0 4px 12px var(--shadow);
  transition: background-color 0.2s ease;
}

dialog {
  background-color: var(--elements-bg);
  color: var(--text-color);
  border: 1px solid var(--border-color);
  border-radius: 12px;
  padding: 24px;
  box-shadow: 0 8px 24px var(--shadow);
  text-align: center;
}

dialog::backdrop {
  background-color: rgba(0, 0, 0, 0.6);
}

button {
  background-color: blue;
  color: white;
  border: none;
  padding: 10px 18px;
  border-radius: 6px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  margin: 6px;
}

button:hover {
  background-color: darkblue;
}

.close-btn {
  background-color: transparent;
  color: var(--text-color);
  border: 1px solid var(--border-color);
}

.input-group {
  margin: 12px 0;
  text-align: left;
}

.input-group label {
  color: var(--text-color);
}

.input-group input {
  width: 100%;
  padding: 8px;
  margin-top: 4px;
  border: 1px solid var(--border-color);
  border-radius: 6px;
  background-color: var(--bg-color);
  color: var(--text-color);
  box-sizing: border-box;
}
</style>
</head>
<body>
<header>
  <img src="https://github.com/johnny0robot/johnnyclassroom/blob/main/Untitled%20design%20(2).png?raw=true" alt="Johnny Classroom Logo">
  <h1>Johnny Classroom</h1>
  <button id="authBtn" onclick="document.getElementById('signInPopup').showModal()">Sign In</button>
</header>

<div id="profileCard" class="card" style="display: none;">
  <h2 id="userName"></h2>
  <p id="userRole"></p>
  <h3>My Classes</h3>
  <ul id="classList"></ul>
</div>

<dialog id="signInPopup">
  <h2>Sign In</h2>
  <div id="passwordForm">
    <div class="input-group">
      <label for="usernameInput">Username:</label>
      <input type="text" id="usernameInput" placeholder="Enter username">
    </div>
    <div class="input-group">
      <label for="passwordInput">Password:</label>
      <input type="password" id="passwordInput" placeholder="Enter password">
    </div>
    <button onclick="signIn()">Sign In</button>
  </div>
  <br><br>
  <button class="close-btn" onclick="document.getElementById('signInPopup').close()">Close</button>
</dialog>

<script>
const owner = 'johnny0robot';
const repo = 'johnnyclassroom';
const path = 'data.json';
const token = process.env.GITHUB_TOKEN;

async function updateGitHubFile(newText, fileSha) {
  const updatedContentBase64 = Buffer.from(newText, 'utf-8').toString('base64');
  const response = await fetch(`https://github.com{owner}/${repo}/contents/${path}`, {
    method: 'PUT',
    headers: {
      'Authorization': `Bearer ${token}`,
      'Accept': 'application/vnd.github+json',
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({
      message: 'Updated file via website text editor',
      content: updatedContentBase64,
      sha: fileSha
    })
  });
  return await response.json();
}

function signIn() {}

async function updateJsonFile(modifiedObject, fileSha) {
  const jsonString = JSON.stringify(modifiedObject, null, 2);
  const updatedContentBase64 = Buffer.from(jsonString, 'utf-8').toString('base64');
  const response = await fetch(`https://github.com{owner}/${repo}/contents/${path}`, {
    method: 'PUT',
    headers: {
      'Authorization': `Bearer ${token}`,
      'Accept': 'application/vnd.github+json',
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({
      message: 'Automated data.json update via website',
      content: updatedContentBase64,
      sha: fileSha
    })
  });
  return await response.json();
}
</script>
</body>
</html>
