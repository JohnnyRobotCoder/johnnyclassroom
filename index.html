<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>Johnny Classroom</title>
<link rel="icon" href="https://github.com">
<link rel="preconnect" href="https://googleapis.com">
<link rel="preconnect" href="https://gstatic.com" crossorigin>
<link href="https://googleapis.com" rel="stylesheet">
<style>
:root {
  color-scheme: light dark;
  --bg-color: #ffffff;
  --text-color: #202124;
  --header-bg: #f1f3f4;
  --elements-bg: #ffffff;
  --card-bg: #ffffff;
  --border-color: #e0e0e0;
  --list-bg: #f8f9fa;
  --accent: #1a73e8;
  --shadow: rgba(0, 0, 0, 0.1);
  --brand-red: #e54c30;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg-color: #202124;
    --text-color: #e8eaed;
    --header-bg: #2d2d30; 
    --elements-bg: #292a2d;
    --card-bg: #292a2d;
    --border-color: #3c4043;
    --list-bg: #35363a;
    --accent: #8ab4f8;
  }
}

body {
  font-family: Roboto, "Google Sans Flex", sans-serif;
  background-color: var(--bg-color);
  color: var(--text-color);
  margin: 0;
  padding: 0;
  transition: background-color 0.2s ease, color 0.2s ease;
}

header {
  background-color: var(--header-bg);
  border-bottom: 1px solid var(--border-color);
  padding: 15px 30px;
  display: flex;
  align-items: center;
  box-shadow: 0 2px 4px var(--shadow);
  transition: background-color 0.2s ease;
}

header img {
  height: 40px;
  margin-right: 15px;
}

header h1 {
  margin: 0;
  font-size: 28px;
  color: var(--brand-red);
}

header button {
  margin-left: auto;
}

ul {
  list-style-type: none;
  padding: 0;
}

li {
  background: var(--list-bg);
  border: 1px solid var(--border-color);
  margin: 6px 0;
  padding: 8px;
  border-radius: 6px;
  font-family: monospace;
}

.card {
  background-color: var(--card-bg);
  border: 1px solid var(--border-color);
  border-radius: 12px;
  padding: 20px;
  max-width: 350px;
  margin: 40px auto;
  text-align: center;
  box-shadow: 0 4px 12px var(--shadow);
  transition: background-color 0.2s ease;
}

dialog {
  background-color: var(--elements-bg);
  color: var(--text-color);
  border: 1px solid var(--border-color);
  border-radius: 12px;
  padding: 24px;
  box-shadow: 0 8px 24px var(--shadow);
  text-align: center;
}

dialog::backdrop {
  background-color: rgba(0, 0, 0, 0.6);
}

button {
  background-color: blue;
  color: white;
  border: none;
  padding: 10px 18px;
  border-radius: 6px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  margin: 6px;
}

button:hover {
  background-color: darkblue;
}

.close-btn {
  background-color: transparent;
  color: var(--text-color);
  border: 1px solid var(--border-color);
}

.input-group {
  margin: 12px 0;
  text-align: left;
}

.input-group label {
  color: var(--text-color);
}

.input-group input {
  width: 100%;
  padding: 8px;
  margin-top: 4px;
  border: 1px solid var(--border-color);
  border-radius: 6px;
  background-color: var(--bg-color);
  color: var(--text-color);
  box-sizing: border-box;
}

/* RED LOADING SCREEN SCREEN OVERLAY */
.loading-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background-color: rgba(0, 0, 0, 0.7);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 9999;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
}

.loading-overlay.active {
  opacity: 1;
  pointer-events: auto;
}

.loader {
  width: 60px;
  height: 60px;
  border: 6px solid rgba(229, 76, 48, 0.2);
  border-top: 6px solid var(--brand-red);
  border-radius: 50%;
  animation: spin 1s linear infinite;
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}
</style>
</head>
<body>

<!-- Global Red Loading Overlay -->
<div id="loadingScreen" class="loading-overlay">
  <div class="loader"></div>
</div>

<header>
  <img src="https://github.com" alt="Johnny Classroom Logo">
  <h1>Johnny Classroom</h1>
  <button id="authBtn" onclick="document.getElementById('signInPopup').showModal()">Sign In</button>
</header>

<div id="profileCard" class="card" style="display: none;">
  <h2 id="userName"></h2>
  <p id="userRole"></p>
  <h3>My Classes</h3>
  <ul id="classList"></ul>
</div>

<dialog id="signInPopup">
  <h2>Sign In</h2>
  <div id="passwordForm">
    <div class="input-group">
      <label for="usernameInput">Username:</label>
      <input type="text" id="usernameInput" placeholder="Enter username">
    </div>
    <div class="input-group">
      <label for="passwordInput">Password:</label>
      <input type="password" id="passwordInput" placeholder="Enter password">
    </div>
    <button onclick="signIn()">Sign In</button>
  </div>
  <br><br>
  <button class="close-btn" onclick="document.getElementById('signInPopup').close()">Close</button>
</dialog>

<dialog id="addClassPopup"></dialog>
<script>
const owner = 'johnny0robot';
const repo = 'johnnyclassroom';
const path = 'data.json';

// Keep track of this security element securely.
const token = 'YOUR_GITHUB_TOKEN_HERE'; 

let accountRole = null;  
let userEmail = null;
let ownedClasses = [];
let teachingClasses = [];
let classes = [];
let mutedClasses = [];

// Helper functions to control the red loading overlay
function showLoader() {
  document.getElementById('loadingScreen').classList.add('active');
}

function hideLoader() {
  document.getElementById('loadingScreen').classList.remove('active');
}
  
async function updateGitHubFile(newText, fileSha) {
  showLoader();
  try {
    const updatedContentBase64 = btoa(unescape(encodeURIComponent(newText)));
    const response = await fetch(`https://github.com{owner}/${repo}/contents/${path}`, {
      method: 'PUT',
      headers: {
        'Authorization': `Bearer ${token}`,
        'Accept': 'application/vnd.github+json',
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        message: 'Updated file via website text editor',
        content: updatedContentBase64,
        sha: fileSha
      })
    });
    return await response.json();
  } catch (error) {
    console.error("Error updating file:", error);
  } finally {
    hideLoader();
  }
}

async function signIn() {
  const usernameVal = document.getElementById("usernameInput").value;
  const passwordVal = document.getElementById("passwordInput").value;
  
  if (!usernameVal || !passwordVal) {
    alert("Please fill out all fields.");
    return;
  }

  showLoader();
  try {
    const fileData = await getGitHubFile();
    
    if (!fileData || !fileData.users) {
      alert("Could not load user data from storage.");
      return;
    }

    const users = fileData.users;
    const userRow = users.find(user => user.username === usernameVal && user.password === passwordVal);

    if (userRow) {
      userEmail = userRow.email;  
      accountRole = userRow.role || 'Student';
      
      document.getElementById('signInPopup').close();
      document.getElementById('authBtn').style.display = 'none';
      
      document.getElementById('userName').innerText = usernameVal;
      document.getElementById('userRole').innerText = accountRole;
      document.getElementById('profileCard').style.display = 'block';
      
      alert(`Welcome back, ${usernameVal}!`);
    } else {
      alert("Invalid credentials!"); 
    }
  } catch (error) {
    console.error("Sign-in process failed:", error);
    alert("An error occurred during sign-in.");
  } finally {
    hideLoader();
  }
}

async function getGitHubFile() {
  showLoader();
  try {
    const response = await fetch(`https://github.com{owner}/${repo}/contents/${path}`, {
      method: 'GET',
      headers: {
        'Authorization': `Bearer ${token}`,
        'Accept': 'application/vnd.github+json'
      }
    });

    if (!response.ok) {
      throw new Error(`HTTP error! status: ${response.status}`);
    }

    const data = await response.json();
    const decodedText = decodeURIComponent(escape(atob(data.content))); 
    return JSON.parse(decodedText); 
  } catch (error) {
    console.error("Failed fetching configuration data:", error);
    return null;
  } finally {
    hideLoader();
  }
}
</script>
</body>
</html>
